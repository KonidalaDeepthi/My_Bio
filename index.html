<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Konidala Deepthi — Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #EF4444;
      --primary-hover: #DC2626;
      --bg: #0B1120;
      --card: #1E293B;
      --text: #FFFFFF;
      --muted: #D1D5DB;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      -webkit-font-smoothing: antialiased;
    }
    .links-container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      object-fit: cover;
      margin-bottom: 1rem;
    }
    .name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .title {
      font-size: 1rem;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .link-btn {
      display: block;
      width: 100%;
      padding: 1rem;
      background-color: var(--card);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      border-radius: 99px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: background-color 0.2s ease;
    }
    .link-btn:hover {
      background-color: #2D3748; /* slightly lighter than card background */
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="links-container">
    <img src="assets/deepthi.jpeg.jpeg" alt="Konidala Deepthi" class="profile-img">
    <h1 class="name">Konidala Deepthi</h1>
    <p class="title">AIML Student | Machine Learning Enthusiast</p>
    
    <div class="links-list">
      <a href="portfolio.html" class="link-btn">Portfolio</a>
      <a href="https://github.com/KonidalaDeepthi" target="_blank" rel="noopener noreferrer" class="link-btn">GitHub</a>
      <a href="https://linkedin.com/in/konidala-deepthi-651713367" target="_blank" rel="noopener noreferrer" class="link-btn">LinkedIn</a>
      <a href="https://leetcode.com/u/_Deepthi_konidala123/" target="_blank" rel="noopener noreferrer" class="link-btn">LeetCode</a>
      <a href="https://www.geeksforgeeks.org/profile/konidaladeepthi1425" target="_blank" rel="noopener noreferrer" class="link-btn">GeeksforGeeks</a>
    </div>
  </div>
</body>
</html>
